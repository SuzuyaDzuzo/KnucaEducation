<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Учебный комбайн</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <h1 class="header-title">Учебный трекер</h1>
        <span id="current-week-badge" class="week-badge">Загрузка...</span>
      </div>
      <div id="last-updated" class="header-sub"></div>
    </header>

    <main class="content">
      <section id="tab-deadlines" class="tab-panel active">
        <div class="actions-bar">
          <button id="copy-summary-btn" class="primary-btn">Скопировать сводку на неделю</button>
        </div>

        <div id="subject-filters" class="chips-scroll"></div>

        <div class="section-header">
          <h2>Баллы по предметам</h2>
        </div>
        <div id="scores-container" class="scores-grid"></div>

        <div id="deadlines-container"></div>
      </section>

      <section id="tab-schedule" class="tab-panel">
        <div class="segmented-control">
          <button class="seg-btn" data-week="1">Числитель</button>
          <button class="seg-btn" data-week="2">Знаменатель</button>
        </div>

        <div id="day-selector" class="days-bar"></div>

        <div id="schedule-container" class="cards-list"></div>
      </section>

      <section id="tab-session" class="tab-panel">
        <div id="countdown-container" class="countdown-grid"></div>

        <div class="section-header">
          <h2>Экзамены и зачеты</h2>
        </div>
        <div id="exams-container" class="cards-list"></div>

        <div class="section-header">
          <h2>Преподаватели и Teams</h2>
        </div>
        <div id="teachers-container" class="cards-list"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-target="tab-deadlines">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
        <span>Дедлайны</span>
      </button>
      <button class="nav-btn" data-target="tab-schedule">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Расписание</span>
      </button>
      <button class="nav-btn" data-target="tab-session">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Сессия</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
