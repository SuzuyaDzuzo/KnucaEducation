<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>КНУБА • ЕСА-26</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <h1 class="title">КНУБА • ЕСА-26</h1>
        <div class="subtitle" id="updated-at">Загрузка данных...</div>
      </div>
      <button class="today-btn" id="today-btn" type="button">Сегодня</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="schedule" type="button">Расписание</button>
      <button class="tab" data-tab="tasks" type="button">Дедлайны</button>
      <button class="tab" data-tab="subjects" type="button">Предметы</button>
      <button class="tab" data-tab="session" type="button">Сессия</button>
    </nav>

    <main class="content">
      <section class="panel active" id="panel-schedule">
        <div class="calendar-strip" id="calendar-strip"></div>
        <div class="selected-date-label" id="selected-date-label"></div>
        <div class="list" id="schedule-list"></div>
      </section>

      <section class="panel" id="panel-tasks">
        <div class="list" id="tasks-list"></div>
      </section>

      <section class="panel" id="panel-subjects">
        <div class="list" id="subjects-list"></div>
      </section>

      <section class="panel" id="panel-session">
        <div class="session-summary" id="session-summary"></div>
        <div class="list" id="exams-list"></div>
      </section>
    </main>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
